meaning_analytics:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: scenic-healer-486415-u3
      dataset: dbt_meaning
      keyfile: service-account.json
      threads: 4
      timeout_seconds: 300
      location: EU
      priority: interactive
      maximum_bytes_billed: 10000000000  # 10 GB: the Sunday full refresh rescans every GA4 export; it passed 1 GB on 4 Oct 2026

    prod:
      type: bigquery
      method: service-account
      project: scenic-healer-486415-u3
      dataset: meaning_marts
      keyfile: service-account.json
      threads: 4
      timeout_seconds: 300
      location: EU
      priority: interactive
      maximum_bytes_billed: 5000000000  # 5 GB
