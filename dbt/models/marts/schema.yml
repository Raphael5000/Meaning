version: 2

models:
  - name: sessions
    description: >
      One row per session. Aggregated from stg_events using ga_session_id.
      Includes landing/exit pages, traffic source, engagement, device, and geo.
    columns:
      - name: session_key
        description: Surrogate key (property_id-user_pseudo_id-ga_session_id)
        tests:
          - unique
          - not_null
      - name: session_date
        description: Date of session start
      - name: session_start
        description: Timestamp of first event in session
      - name: pageviews
        description: Number of page_view events in the session
      - name: is_bounce
        description: True if session had 1 or fewer pageviews and no engagement
      - name: landing_page
        description: URL of the first page viewed
      - name: session_source
        description: Traffic source (last-click attribution)
      - name: session_medium
        description: Traffic medium (last-click attribution)
      - name: session_default_channel_group
        description: GA4 default channel grouping

  - name: pageviews
    description: >
      One row per page_view event. Enriched with session traffic source,
      device, and geo context.
    columns:
      - name: event_timestamp
        description: Timestamp of the pageview
        tests:
          - not_null
      - name: page_location
        description: Full page URL

  - name: users
    description: >
      One row per user per property (property_id + user_pseudo_id).
      Aggregated from sessions. Includes acquisition attribution,
      lifetime metrics, and recency.
    tests:
      - unique:
          column_name: "property_id || '-' || user_pseudo_id"
    columns:
      - name: user_pseudo_id
        description: GA4 anonymous user identifier
        tests:
          - not_null
      - name: first_seen
        description: Timestamp of user's first session
      - name: total_sessions
        description: Lifetime session count
      - name: acquisition_source
        description: Traffic source of the user's first session
      - name: acquisition_channel_group
        description: Channel group of the user's first session

  - name: traffic_sources
    description: >
      Pre-aggregated daily traffic source performance.
      One row per date + property + source + medium + channel_group.
    columns:
      - name: session_date
        description: Date
        tests:
          - not_null
      - name: source
        description: Traffic source
      - name: medium
        description: Traffic medium
      - name: sessions
        description: Number of sessions from this source on this date

  - name: conversions
    description: >
      One row per conversion event (custom events, excluding standard
      auto-collected GA4 events). Used for goal tracking and attribution.
    columns:
      - name: event_name
        description: Conversion event name
        tests:
          - not_null

  - name: ads_campaign_performance
    description: >
      Daily Google Ads campaign performance metrics.
      One row per campaign per day with impressions, clicks, cost, conversions, and derived metrics.
    columns:
      - name: stats_date
        description: Date of the metrics
        tests:
          - not_null
      - name: campaign_id
        description: Google Ads campaign ID
        tests:
          - not_null
      - name: campaign_name
        description: Campaign display name
      - name: cost
        description: Spend in currency units (cost_micros / 1e6)
      - name: roas
        description: Return on ad spend (conversions_value / cost)

  - name: ads_keyword_performance
    description: >
      Daily Google Ads keyword/ad-group performance metrics.
      One row per ad group per day with keyword details and performance metrics.
    columns:
      - name: stats_date
        description: Date of the metrics
        tests:
          - not_null
      - name: keyword_text
        description: Keyword text
      - name: match_type
        description: Keyword match type (BROAD, PHRASE, EXACT)

  - name: ads_ga4_attribution
    description: >
      GA4 sessions attributed to Google Ads clicks via gclid.
      Each row is a session that originated from an Ads click, enriched with
      campaign name, ad group, keyword, and cost data.
    columns:
      - name: session_key
        description: Surrogate key from sessions table
        tests:
          - not_null
      - name: gclid
        description: Google click identifier linking Ads click to GA4 session
        tests:
          - not_null
      - name: campaign_name
        description: Google Ads campaign name

  - name: ads_attribution_summary
    description: >
      Daily aggregated attribution summary. Joins GA4 attributed sessions
      with Google Ads cost data for full ROI analysis per campaign/keyword.
    columns:
      - name: session_date
        description: Date
        tests:
          - not_null
      - name: campaign_id
        description: Google Ads campaign ID
      - name: attributed_sessions
        description: Number of GA4 sessions attributed to this campaign/keyword
      - name: ads_cost
        description: Google Ads spend for this campaign on this date
      - name: cost_per_attributed_session
        description: Ads cost divided by number of attributed sessions
