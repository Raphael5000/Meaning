version: 2

sources:
  - name: ga4_raw
    description: Raw GA4 BigQuery export tables
    database: scenic-healer-486415-u3
    schema: analytics_404628120
    tables:
      - name: events
        description: Daily GA4 event export (sharded by date as events_YYYYMMDD)
        identifier: "events_*"
      - name: pseudonymous_users
        description: GA4 pseudonymous user data (sharded by date)
        identifier: "pseudonymous_users_*"

  - name: backfill
    description: Historical backfill data from GA4 API
    database: scenic-healer-486415-u3
    schema: dbt_meaning
    tables:
      - name: backfill_sessions
        description: Backfilled session rows from GA4 API (aggregated, not raw events)
      - name: backfill_traffic_sources
        description: Backfilled daily traffic source aggregates from GA4 API

  - name: google_ads
    description: Google Ads data imported via BigQuery Data Transfer Service
    database: scenic-healer-486415-u3
    schema: ads_{{ var('ads_customer_id', '0000000000') }}
    tables:
      - name: ads_Campaign
        description: Campaign metadata (names, types, budgets, status)
      - name: ads_AdGroup
        description: Ad group details within campaigns
      - name: ads_Keyword
        description: Keyword text, match type, and status
      - name: ads_ClickStats
        description: Per-click data with gclid, campaign_id, ad_group_id
        identifier: ads_ClickStats
      - name: ads_CampaignBasicStats
        description: Daily campaign-level metrics (impressions, clicks, cost, conversions)
      - name: ads_AdGroupBasicStats
        description: Daily ad group-level metrics
